spring.application.name=questkeep
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/questkeep}
spring.datasource.username=${DATABASE_USERNAME:questkeep}
spring.datasource.password=${DATABASE_PASSWORD:questkeep}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mvc.problemdetails.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT:ecs}
