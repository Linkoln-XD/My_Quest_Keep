spring.application.name=questkeep
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/questkeep}
spring.datasource.username=${DATABASE_USERNAME:questkeep}
spring.datasource.password=${DATABASE_PASSWORD:questkeep}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mvc.problemdetails.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT:ecs}

questkeep.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}
questkeep.jwt.access-ttl=15m
questkeep.jwt.refresh-ttl=7d

questkeep.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

questkeep.staff.email=${STAFF_EMAIL:staff@questkeep.local}
questkeep.staff.password=${STAFF_PASSWORD:ChangeMe_Staff_Demo_1}

